# EquiSSL v10 contrastive SSL rescue recipe.
#
# Goal: produce a downstream-useful self-supervised encoder quickly enough for
# the SIGGRAPH Asia / TOG cycle. This deliberately stops treating MAE as
# mandatory. The recipe combines:
#   - EMA teacher/student self-distillation (DINO/iBOT style)
#   - global contrastive alignment between unrotated and rotated views
#   - light SO(3) rotation prediction auxiliary loss
#   - KoLeo anti-collapse regularization
#
# Downstream gate before full sweeps:
#   checkpoint -> C6 no-area seed 42 finetune should beat the v9 KoLeo
#   downstream result (61.42) and move toward random-init performance (~67).

model:
  img_rank: 7
  node_type: "vertex"
  embed_dim: 48
  num_scales: 4
  in_scale_factor: 2
  enc_depths: [2, 2, 6, 2]
  bottleneck_depth: 2
  enc_num_heads: [3, 6, 12, 24]
  dec_depths: [2, 2, 2, 2]
  dec_num_heads: [24, 24, 12, 6]
  d_head_coef: 2
  win_size_coef: 2
  mlp_ratio: 4.0
  qkv_bias: true
  drop_path_rate: 0.15
  abs_pos_enc_in: false
  abs_pos_enc: false
  rel_pos_bias: true
  rel_pos_bias_size: 7
  equivariant_rpe: true
  n_gauges: 6
  area_weighted: true

ssl:
  proj_dim: 256
  out_dim: 8192
  mask_ratio: 0.25
  teacher_momentum: 0.996
  teacher_temp: 0.04
  student_temp: 0.1
  center_momentum: 0.95
  cls_weight: 0.5
  patch_weight: 0.5
  contrast_weight: 1.0
  contrast_temp: 0.2
  rot_weight: 0.2
  rot_bins: 36
  koleo_weight: 0.02

data:
  root_dir: "${WORKSPACE}/Structured3D"
  image_key: "rgb_rawlight"
  normalize_mean: 0.5
  normalize_std: 0.225
  color_augment: true
  num_workers: 8

training:
  epochs: 100
  batch_size: 8
  gradient_accumulation: 3
  lr: 5.0e-4
  min_lr: 1.0e-6
  weight_decay: 0.04
  warmup_epochs: 10
  teacher_momentum_end: 1.0
  clip_grad: 3.0
  save_freq: 10
  log_interval: 50

output:
  dir: "outputs/pretrain_v10_contrastive"
  wandb: false
