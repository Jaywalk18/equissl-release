# EquiSSL Finetune with Layer-wise LR Decay
# Shallow layers get smaller lr, deep layers get larger lr
# Prevents pretrained features from being destroyed during finetuning
# Standard technique from MAE/iBOT finetuning

stage1:
  epochs: 50
  lr: 5.0e-4
  batch_size: 8
  num_workers: 8
  freeze_encoder: true
  load_decoder: true

stage2:
  epochs: 350
  lr: 1.0e-4
  batch_size: 8
  num_workers: 8
  freeze_encoder: false
  load_decoder: true
  layer_decay: 0.65  # lr multiplier per layer (deeper = higher lr)

loss:
  type: "cross_entropy"
  ignore_index: 0
